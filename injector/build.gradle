//file:noinspection GrUnresolvedAccess
plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version "${paperweight_version}"
}

group = 'me.supcheg'
version = '1.1.0'

repositories {
    mavenCentral()
}

dependencies {
    paperweight.paperDevBundle "${minecraft_version}-R0.1-SNAPSHOT"
    implementation "org.javassist:javassist:${javaassist_version}"
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"
}

jar {
    finalizedBy reobfJar
}

java {
    sourceCompatibility JavaVersion.toVersion(java_version)
    targetCompatibility JavaVersion.toVersion(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.release.set java_version as int
    options.encoding 'UTF-8'
    sourceCompatibility java_version
    targetCompatibility java_version
}